<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="profile-page.css">
</head>
<body>

<!-- Hamburger icon -->
<div class="hamburger" id="hamburger">&#9776;</div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="close-sidebar" id="closeSidebar">&times;</div>
  <h2>Menu</h2>
  <a href="Homepage.html"><i class="fas fa-home"></i> Home</a>
  <a href="profile.html"><i class="fas fa-user-circle"></i> Profile</a>
  <a href="upload.html"><i class="fas fa-upload"></i> Upload Video</a>
</aside>

<!-- Main content -->
<div class="main-content">

  <div class="profile-header">
    <h1>Identity Information</h1>
    <p class="header-subtitle">Your personal details and account info</p>
  </div>

  <div class="identity-card-container">
    <div class="identity-card">
      <div class="avatar-section">
        <div class="avatar-circle">
          <i class="fas fa-user"></i>
        </div>
        <h2 id="display-name">User Name</h2>
      </div>

      <div class="info-grid">
        <div class="info-item">
          <i class="fas fa-id-card icon"></i>
          <div class="info-label">Full Name</div>
          <div class="info-value" id="name">Loading...</div>
        </div>

        <div class="info-item">
          <i class="fas fa-envelope icon"></i>
          <div class="info-label">Email Address</div>
          <div class="info-value" id="email">Loading...</div>
        </div>

        <div class="info-item">
          <i class="fas fa-calendar-alt icon"></i>
          <div class="info-label">Date of Birth</div>
          <div class="info-value" id="dob">Loading...</div>
        </div>

        <div class="info-item">
          <i class="fas fa-venus-mars icon"></i>
          <div class="info-label">Gender</div>
          <div class="info-value" id="gender">Loading...</div>
        </div>

        <div class="info-item">
          <i class="fas fa-phone icon"></i>
          <div class="info-label">Phone Number</div>
          <div class="info-value" id="phone">Loading...</div>
        </div>
      </div>

      <div class="card-footer">
        <a href="profile.html" class="back-btn">
          <i class="fas fa-arrow-left"></i> Back to Profile
        </a>
      </div>
    </div>
  </div>

</div>

<script src="profile-content.js"></script>
<script src="hamburger.js"></script>
</body>
</html>
