<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landing Page</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
</head>

<body class="min-h-screen flex flex-col items-center justify-center bg-gray-100 font-[Poppins] px-4">

  <!-- SLIDER WRAPPER -->
  <div
    class="relative w-full max-w-md md:max-w-xl bg-white rounded-xl overflow-hidden
    shadow-[0_-6px_14px_rgba(0,0,0,0.25),_0_4px_10px_rgba(0,0,0,0.15)]"
  >
    <!-- SLIDES -->
    <div
      id="slides"
      class="flex w-full transition-transform duration-500 ease-in-out"
    >

      <!-- SLIDE 1 -->
      <div class="w-full flex-shrink-0 px-6 py-4 md:px-8 md:py-6 flex flex-col items-center text-center">
        <h2 class="font-semibold text-gray-800 text-lg md:text-2xl mb-3">
          Welcome To SkillHarvest
        </h2>

        <img
          src="images/image 10.png"
          alt="Grain field"
          class="w-full h-64 md:h-72 lg:h-80 object-cover rounded-lg"
        />
      </div>

      <!-- SLIDE 2 -->
      <div class="w-full flex-shrink-0 px-6 py-4 md:px-8 md:py-6 flex flex-col items-center text-center">
        <h2 class="font-semibold text-gray-800 text-lg md:text-2xl mb-3 max-w-md md:max-w-xl">
          Where knowledge from years of experience is passed down from generation to generation
        </h2>

        <img
          src="images/unsplash_acwQfNie9TA.png"
          alt="Farmer picking tomatoes"
          class="w-full h-64 md:h-72 lg:h-80 object-cover rounded-lg"
        />
      </div>

      <!-- SLIDE 3 -->
      <div class="w-full flex-shrink-0 px-6 py-4 md:px-8 md:py-6 flex flex-col items-center text-center">
        <h2 class="font-semibold text-gray-800 text-lg md:text-2xl mb-3 max-w-md md:max-w-xl">
          Ask questions, get answers and connect with experienced farmers.
        </h2>

        <img
          src="images/image 19.png"
          alt="Farmer interview"
          class="w-full h-64 md:h-72 lg:h-80 object-cover rounded-lg"
        />
      </div>

    </div>
  </div>

  <!-- DOTS -->
  <div class="flex gap-2 mt-4">
    <span class="dot w-2 h-2 rounded-full bg-green-600 cursor-pointer" data-index="0"></span>
    <span class="dot w-2 h-2 rounded-full bg-gray-400 cursor-pointer" data-index="1"></span>
    <span class="dot w-2 h-2 rounded-full bg-gray-400 cursor-pointer" data-index="2"></span>
  </div>

  <!-- BUTTONS -->
  <div class="flex gap-3 mt-4">
    <button id="prevBtn" class="px-4 py-2 bg-green-600 text-xs text-white rounded">
      Previous
    </button>

    <button id="nextBtn" class="px-4 py-2 bg-green-600 text-xs text-white rounded">
      Next
    </button>

    <a href="Homepage.html" target="_blank" rel="noopener noreferrer">
      <button class="px-4 py-2 bg-green-600 text-xs text-white rounded">
        Skip
      </button>
    </a>
  </div>

  <script src="landing-page-script.js"></script>
</body>
</html>
