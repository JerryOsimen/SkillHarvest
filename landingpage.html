<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landing Page</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    .slider-card {
      box-shadow:0px 3px 6px #00000029;
    }
  </style>
</head>

<body
  class="flex flex-col items-center @container justify-center h-screen overflow-hidden font-poppins bg-gray-50 px-4 sm:px-6 md:px-12"
>

  <!-- Slider container -->
  <div
    class="
      w-full
      max-w-[360px] sm:max-w-[420px] md:max-w-[500px]
      h-[62vh] sm:h-[72vh] md:h-[75vh]
      bg-white rounded-xl overflow-hidden slider-card
      px-5 py-5 sm:px-5 md:px-5
      flex flex-col justify-center
    "
  >

    <div
      id="slides"
      class="flex h-full transition-transform duration-500 ease-in-out"
    >

      <!-- Card 1 -->
      <div
        class="flex flex-col items-center justify-around min-w-full h-full p-4 sm:p-5 md:p-6 text-center"
      >
        <h2 class="font-semibold text-gray-800 max-md:text-lg max-sm:mb-0 sm:text-xl md:text-2xl mb-2">
          Welcome To SkillHarvest
        </h2>

        <img
          src="images/image 10.png"
          alt="picture of a grain field"
          class="rounded-lg w-full max-h-[41vh]  sm:max-h-[45vh] md:max-h-[50vh] object-contain"
        />
      </div>

      <!-- Card 2 -->
      <div
        class="flex flex-col items-center justify-around min-w-full h-full p-4 sm:p-5 md:p-6 text-center"
      >
        <h2 class="font-semibold  text-gray-800 max-sm:text-[10px] mb-2">
          Where knowledge from years of experience is passed down from generation to generation
        </h2>

        <img
          src="images/unsplash_acwQfNie9TA.png"
          alt="picture of an old white farmer picking tomatoes from the garden"
          class="rounded-lg w-full max-h-[42vh] sm:max-h-[42vh] md:max-h-[46vh] object-contain"
        />
      </div>

      <!-- Card 3 -->
      <div
        class="flex flex-col items-center justify-around min-w-full h-full p-4 sm:p-5 md:p-6 text-center"
      >
        <h2 class="font-semibold text-gray-800 max-sm:text-[10px] mb-2">
          Ask questions, get answers and connect with experienced farmers.
        </h2>

        <img
          src="images/image 19.png"
          alt="picture of an old farmer having an interview with young students"
          class="rounded-lg w-full max-h-[42vh] sm:max-h-[42vh] md:max-h-[46vh] object-contain"
        />
      </div>

    </div>
  </div>

  <!-- DOTS -->
  <div class="flex gap-2 mt-3 sm:mt-4">
    <span class="dot size-2 rounded-full bg-green-600 cursor-pointer" data-index="0"></span>
    <span class="dot size-2 rounded-full bg-gray-400 cursor-pointer" data-index="1"></span>
    <span class="dot size-2 rounded-full bg-gray-400 cursor-pointer" data-index="2"></span>
  </div>

  <!-- BUTTONS -->
  <div class="flex gap-2 sm:gap-3 mt-3 sm:mt-4 justify-center flex-wrap">
    <button
      id="prevBtn"
      class="px-4 sm:px-5 py-2 bg-green-600 text-white text-[11px] sm:text-xs rounded-md shadow-lg"
    >
      Previous
    </button>

    <button
      id="nextBtn"
      class="px-4 sm:px-5 py-2 bg-green-600 text-white text-[11px] sm:text-xs rounded-md shadow-lg"
    >
      Next
    </button>

    <a href="Homepage.html" target="_blank" rel="noopener noreferrer">
      <button
        class="px-4 sm:px-5 py-2 bg-green-600 text-white text-[11px] sm:text-xs rounded-md shadow-lg"
      >
        Skip
      </button>
    </a>
  </div>

  <script src="landing-page-script.js"></script>
</body>
</html>
