<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landing Page</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
  /* Extra strong top shadow for small screens */
  .slider-card {
    box-shadow: 0 -25px 50px rgba(0,0,0,0.4), 0 5px 15px rgba(0,0,0,0.1);
  }

  @media (min-width: 640px) { /* sm and up: tablet */
    .slider-card {
      box-shadow: 0 -10px 30px rgba(0,0,0,0.25), 0 5px 15px rgba(0,0,0,0.1);
    }
  }

  @media (min-width: 1024px) { /* lg and up: PC */
    .slider-card {
      box-shadow: 0 -8px 25px rgba(0,0,0,0.2), 0 4px 12px rgba(0,0,0,0.08);
    }
  }
</style>

</head>
<body class="flex flex-col items-center justify-center min-h-screen font-poppins bg-gray-50 px-6 sm:px-8 md:px-12">

  <!-- Slider container -->
 <div class="w-full max-w-[380px] sm:max-w-[450px] md:max-w-[500px] lg:max-w-[550px] bg-white rounded-xl overflow-hidden slider-card"
     style="box-shadow: 0 -10px 30px rgba(0,0,0,0.25), 0 5px 15px rgba(0,0,0,0.1);">
  <div id="slides" class="flex transition-transform duration-500 ease-in-out">
    
      <!-- Card 1 -->
      <div class="flex flex-col items-center justify-between min-w-full p-6 sm:p-8 md:p-10 text-center">
        <h2 class="font-semibold text-gray-800 text-xl sm:text-lg md:text-[30px] mb-3">
          Welcome To SkillHarvest
        </h2>
        <img src="images/image 10.png" alt="picture of a grain field" 
             class="rounded-lg w-full max-w-[300px] sm:max-w-[350px] md:max-w-[400px] lg:max-w-[450px] object-cover">
      </div>

      <!-- Card 2 -->
      <div class="flex flex-col items-center justify-between min-w-full p-6 sm:p-8 md:p-10 text-center">
        <h2 class="font-semibold text-gray-800 text-sm sm:text-base md:text-2xl mb-3">
          Where knowledge from years of experience is passed down from generation to generation
        </h2>
        <img src="images/unsplash_acwQfNie9TA.png" alt="picture of an old white farmer picking tomatoes from the garden"
             class="rounded-lg w-full max-w-[300px] sm:max-w-[350px] md:max-w-[400px] lg:max-w-[450px] object-cover">
      </div>

      <!-- Card 3 -->
      <div class="flex flex-col items-center justify-between min-w-full p-6 sm:p-8 md:p-10 text-center">
        <h2 class="font-semibold text-gray-800 text-sm sm:text-base md:text-2xl mb-3">
          Ask questions, get answers and connect with experienced farmers.
        </h2>
        <img src="images/image 19.png" alt="picture of an old farmer having an interview with young students"
             class="rounded-lg w-full max-w-[300px] sm:max-w-[350px] md:max-w-[400px] lg:max-w-[450px] object-cover">
      </div>

    </div>
  </div>

  <!-- DOTS -->
  <div class="flex gap-2 mt-6">
    <span class="dot w-3 h-3 rounded-full bg-green-600 cursor-pointer" data-index="0"></span>
    <span class="dot w-3 h-3 rounded-full bg-gray-400 cursor-pointer" data-index="1"></span>
    <span class="dot w-3 h-3 rounded-full bg-gray-400 cursor-pointer" data-index="2"></span>
  </div>

  <!-- BUTTONS -->
  <div class="flex gap-3 mt-6 flex-wrap justify-center">
    <button id="prevBtn" class="px-5 py-2 bg-green-600 text-white rounded text-sm sm:text-base shadow-lg">
      Previous
    </button>
    <button id="nextBtn" class="px-5 py-2 bg-green-600 text-white rounded text-sm sm:text-base shadow-lg">
      Next
    </button>
    <a href="Homepage.html" target="_blank" rel="noopener noreferrer">
      <button class="px-5 py-2 bg-green-600 text-white rounded text-sm sm:text-base shadow-lg">
        Skip
      </button>
    </a>
  </div>

  <script src="landing-page-script.js"></script>
</body>
</html>
