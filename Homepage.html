<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Home</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <!--fixed nav icon-->
   <button
   id="menuBtn"
   class="fixed top-4 left-4 z-[60] p-3 bg-white rounded-md text-xl"
   >
   ☰
   </button>
 <!--side bar-->
 <div
 id="sidebar"
 class="fixed top-0 left-0 h-full w-64 bg-white shadow-xl -translate-x-full
 transition-transform duration-300 z-40"
 >
  <nav class="mt-24 flex flex-col gap-6 px-6 text-lg font-medium">
    <a href="" class="hover:text-green-600">Home</a>
    <a href="" class="hover:text-green-600">Profile</a>
    <a href="" class="hover:text-green-600">Upload video</a>
  </nav>
 </div>
    <!--fixed search bar-->
   <div class="fixed top-0 left-0 w-full bg-white shadow z-50 p-4 flex justify-center">
    <input 
    id="searchinput" 
    type="text"
    placeholder="Search farming videos"
    class="w-full md:w-1/2 p-2 rounded-lg border border-gray-400 
    focus:outline-none focus:ring-green-500">
   </div>
   <!--main content-->
  <main class="max-w-7xl pt-28 mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold mb-6">Latest Farming Videos</h1>

    <!-- VIDEO GRID -->

      <section
      id="videoGrid"
      class="grid gap-6
             grid-cols-1
             sm:grid-cols-2
             md:grid-cols-3
             lg:grid-cols-4">
    </section>

   
    <section
      id="videoGrid"
      class="grid gap-6
             grid-cols-1
             sm:grid-cols-2
             md:grid-cols-3
             lg:grid-cols-4">
    </section>
  </main>

  <script src="home.js"></script>
</body>
</html>
