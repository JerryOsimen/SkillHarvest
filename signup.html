<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillHarvest</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1b5e20] text-gray-900">

  <!-- ================= WELCOME ================= -->
  <section id="welcome" class="w-full flex flex-col justify-center items-center
                             h-screen md:h-auto md:max-w-2xl md:mx-auto md:bg-white md:rounded-2xl md:shadow-lg md:p-10
                             overflow-hidden md:overflow-visible px-4">
    <div class="flex flex-col justify-center items-center w-full h-full md:h-auto">
      <h1 class="text-3xl md:text-4xl font-bold text-white mb-10 text-center">
        Welcome to SkillHarvest
      </h1>

      <div class="flex gap-4 w-full md:w-auto flex-col md:flex-row">
        <button class="bg-[#2e7d32] hover:bg-[#1b5e20] text-white py-3 rounded-lg w-full md:w-auto"
                onclick="showForm('signup')">Sign Up</button>
        <button class="bg-[#2e7d32] hover:bg-[#1b5e20] text-white py-3 rounded-lg w-full md:w-auto"
                onclick="showForm('login')">Sign In</button>
      </div>
    </div>
  </section>

  <!-- ================= FORM HOLDER ================= -->
  <section id="holder" class="hidden w-full flex justify-center items-start md:items-center py-10 md:py-20">
    <div class="w-full max-w-lg md:bg-white md:rounded-2xl md:shadow-lg md:p-10
                flex flex-col gap-6 overflow-y-auto h-[calc(100vh-80px)] md:h-auto px-4 md:px-0">

      <!-- ================= SIGN UP FORM ================= -->
      <form id="signupForm" class="hidden flex flex-col gap-4">
        <h2 class="text-2xl font-bold text-center text-white py-3">Create Account</h2>

        <input type="text" placeholder="Full Name" class="signupName border rounded-md p-3 w-full" />
        <span class="error-text text-red-600 text-sm" id="signup-name-error"></span>

        <input type="email" placeholder="Email" class="signupEmail border rounded-md p-3 w-full" />
        <span class="error-text text-red-600 text-sm" id="signup-email-error"></span>

        <input type="date" class="dob border rounded-md p-3 w-full" />
        <span class="error-text text-red-600 text-sm" id="signup-DateOfBirth-error"></span>

        <input type="text" placeholder="Gender" class="gender border rounded-md p-3 w-full" />
        <span class="error-text text-red-600 text-sm" id="signup-gender-error"></span>

        <input type="tel" placeholder="Phone Number" class="phone border rounded-md p-3 w-full" />
        <span class="error-text text-red-600 text-sm" id="signup-phoneNumber-error"></span>

        <div class="relative">
          <input type="password" placeholder="Password" id="signupPassword"
                 class="password border rounded-md p-3 w-full" />
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-blue-500 text-sm cursor-pointer"
                onclick="togglePassword('signupPassword', this)">👁️ Show Password</span>
        </div>
        <span class="error-text text-red-600 text-sm" id="signup-password-error"></span>

        <input type="number" placeholder="Years of Experience" class="experience border rounded-md p-3 w-full" />
        <span class="error-text text-red-600 text-sm" id="signup-experience-error"></span>

        <input type="text" placeholder="Farm Location" class="farmLocation border rounded-md p-3 w-full" />
        <span class="error-text text-red-600 text-sm" id="signup-farmLocation-error"></span>

        <input type="text" placeholder="Farm Type" class="farmType border rounded-md p-3 w-full" />
        <span class="error-text text-red-600 text-sm" id="signup-farmType-error"></span>

        <span class="error-text text-red-600 text-sm" id="signup-general-error"></span>

        <button type="submit" class="bg-[#2e7d32] hover:bg-[#1b5e20] text-white py-3 rounded-lg mt-3 w-full">
          Create Account
        </button>

        <p class="text-center mt-4 text-white">
          Already have an account?
          <span class="text-[#EAB76A] cursor-pointer" onclick="showForm('login')">Login</span>
        </p>
      </form>

      <!-- ================= LOGIN FORM ================= -->
      <form id="loginForm" class="hidden flex flex-col gap-4">
        <h2 class="text-2xl font-bold text-center text-white py-3">Sign In</h2>

        <input type="email" placeholder="Email" class="loginEmail border rounded-md p-3 w-full" />
        <span class="error-text text-red-600 text-sm" id="login-email-error"></span>

        <div class="relative">
          <input type="password" placeholder="Password" id="loginPassword"
                 class="loginPassword border rounded-md p-3 w-full" />
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-blue-500 text-sm cursor-pointer"
                onclick="togglePassword('loginPassword', this)">👁️ Show Password</span>
        </div>
        <span class="error-text text-red-600 text-sm" id="login-password-error"></span>

        <span class="error-text text-red-600 text-sm" id="login-general-error"></span>

        <div class="flex justify-between text-sm">
          <p class="text-blue-500 cursor-pointer" onclick="showForm('forgot')">Forgot Password?</p>
          <p class="text-white cursor-pointer" onclick="showForm('signup')">Sign Up</p>
        </div>

        <button type="submit" class="bg-[#2e7d32] hover:bg-[#1b5e20] text-white py-3 rounded-lg mt-2 w-full">
          Login
        </button>
      </form>

      <!-- ================= FORGOT PASSWORD ================= -->
      <form id="forgotForm" class="hidden flex flex-col gap-4">
        <h2 class="text-2xl font-bold text-center text-[#EAB76A] py-3">Reset Password</h2>

        <input type="email" placeholder="Email" class="forgotName border rounded-md p-3 w-full" />
        <span class="error-text text-red-600 text-sm" id="forgot-name-error"></span>

        <div class="relative">
          <input type="password" placeholder="New Password" id="resetPassword"
                 class="resetPassword border rounded-md p-3 w-full" />
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-blue-500 text-sm cursor-pointer"
                onclick="togglePassword('resetPassword', this)">👁️ Show Password</span>
        </div>
        <span class="error-text text-red-600 text-sm" id="forgot-password-error"></span>

        <span class="error-text text-red-600 text-sm" id="forgot-general-error"></span>

        <button type="submit" class="bg-[#2e7d32] hover:bg-[#1b5e20] text-white py-3 rounded-lg mt-2 w-full">
          Reset Password
        </button>
      </form>

    </div>
  </section>

  <!-- Scripts -->
  <script src="notifications.js"></script>
  <script src="signup.js"></script>
</body>
</html>
