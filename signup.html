<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>

  <div class="container">
    <h1>Welcome to SkillHarvest</h1>

    <div class="btn-group">
      <button onclick="showForm('signup')">Sign Up</button>
      <button onclick="showForm('login')">Sign In</button>
    </div>

    <!-- SIGN UP FORM -->
    <form id="signupForm" class="form hidden">
      <h2>Sign Up</h2>
<!-- name, email, password, farmLocation, farmType, gender, phoneNumber, DateOfBirth, experience -->
      <input type="text" placeholder="Full Name" required  class="signupName" name="name"/>
      <input type="email" placeholder="Email" required name="email" class="signupEmail"/>
      <input type="date" placeholder="Date of Birth" required name="DateOfBirth" class="dob"/>
      <input type="text" placeholder="Gender" required name="gender" class="gender"/>
      <input type="tel" placeholder="Phone Number" required name="phoneNumber" class="phone"/>
      <div class="password-wrapper">
      <input
        type="password"
        id="signupPassword"
        placeholder="Password"
        required
        name="password"
        class="password"
      <span onclick="togglePassword('signupPassword', this)" class="toggleElement">👁️ show password</span>
      </div>

      <input type="number" placeholder="Years of Experience" required name="experience" class="experience"/>
      <input type="text" placeholder="Farm Location" required name="farmLocation" class="farmLocation"/>
      <input type="text" placeholder="Farm Type (Poultry, Rice, Pig etc)" required name="farmType" class="farmType"/>
      

      <button type="submit">Create Account</button>
    </form>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="form hidden">
      <h2>Sign In</h2>

      <input type="text" placeholder="Full Name" required name="name" class="loginName"/>
      <input type="email" placeholder="Email" required name="email" class="loginEmail"/>
      <input type="tel" placeholder="Phone Number" required name="phone" class="loginPhone"/>
      <div class="password-wrapper">
      <input
        type="password"
        id="loginPassword"
        placeholder="Password"
        required
        class="loginPassword"
      />
      <span onclick="togglePassword('loginPassword', this)" class="toggleElement">👁️ show password</span>
      </div>

      <p class="forgot" onclick="showForm('forgot')">
        Forgot Password?
      </p>



      <button type="submit">Login</button>
    </form>
  <!-- FORGOT PASSWORD FORM -->
  <form id="forgotForm" class="form hidden">
    <h2>Reset Password</h2>

    <input type="text" placeholder="Full Name" required name="name" class="forgotName"/>
    <input type="tel" placeholder="Phone Number" required name="phone" class="forgotPhone"/>
    <div class="password-wrapper">
      <input
        type="password"
        id="togglePassword"
        placeholder="Password"
        required
      />
      <span onclick="togglePassword('togglePassword', this)" class="toggleElement">👁️show password</span>
    </div>


    <button type="submit">Reset Password</button>
  </form>
    
  </div>

  <script src="signup.js"></script>


</body>
</html>
