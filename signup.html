<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillHarvest</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="https://kit.fontawesome.com/79e3c5887d.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="notifications.css" />
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center px-4 py-10">

  <!-- WELCOME PAGE -->
  <div
    id="welcome"
    class="w-full max-w-md md:max-w-lg lg:max-w-xl bg-white rounded-xl shadow-[0px_3px_6px_#00000029] p-8 text-center"
  >
    <h1 class="font-bold text-2xl mb-6">Welcome to SkillHarvest</h1>

    <div class="flex flex-col md:flex-row gap-4">
      <button
        class="w-full md:w-1/2 bg-green-700 hover:bg-green-800 text-white py-3 rounded-lg"
        onclick="showForm('signup')"
      >
        Sign Up
      </button>

      <button
        class="w-full md:w-1/2 bg-green-700 hover:bg-green-800 text-white py-3 rounded-lg"
        onclick="showForm('login')"
      >
        Sign In
      </button>
    </div>
  </div>

  <!-- FORM HOLDER -->
  <div
    id="holder"
    class="hidden w-full max-w-md md:max-w-lg lg:max-w-xl bg-white rounded-xl shadow-[0px_3px_6px_#00000029] p-6 md:p-8"
  >

    <!-- SIGN UP FORM -->
    <form id="signupForm" class="hidden flex flex-col gap-4">
      <h1 class="font-bold text-2xl text-center text-[#EAB76A] mb-4">
        Create Account
      </h1>

      <!-- INPUT -->
      <div>
        <label class="block text-sm mb-1">Full Name</label>
        <input id="fullName" class="signupName w-full border border-gray-300  rounded-lg px-3 py-2" placeholder="John Doe" />
        <span class="error-text hidden text-red-500 text-sm" id="signup-name-error"></span>
      </div>

      <div>
        <label class="block text-sm mb-1">Email</label>
        <input type="email" id="email" class="signupEmail w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="example@gmail.com" />
        <span class="error-text hidden text-red-500 text-sm" id="signup-email-error"></span>
      </div>

      <div>
        <label class="block text-sm mb-1">Date of Birth</label>
        <input type="date" id="dob" class="dob w-full border border-gray-300 rounded-lg px-3 py-2" />
        <span class="error-text hidden text-red-500 text-sm" id="signup-DateOfBirth-error"></span>
      </div>

      <div>
        <label class="block text-sm mb-1">Gender</label>
        <input id="gender" placeholder="Gender" class="gender w-full border border-gray-300 rounded-lg px-3 py-2" />
        <span class="error-text hidden text-red-500 text-sm" id="signup-gender-error"></span>
      </div>

      <div>
        <label class="block text-sm mb-1">Phone Number</label>
        <input id="phoneNumber" placeholder="Phone Number" class="phone w-full border border-gray-300 rounded-lg px-3 py-2" />
        <span class="error-text hidden text-red-500 text-sm" id="signup-phoneNumber-error"></span>
      </div>

      <div>
        <label for="signupPassword" class="block text-sm mb-1">Password</label>
        <div class="flex items-center justify-between border border-gray-300 rounded-lg px-3">
          <input
            type="password"
            id="signupPassword"
            placeholder="Password"
            class="password w-full py-2 outline-none"
          />
          <span
            class="text-blue-500 text-sm cursor-pointer"
            onclick="togglePassword('signupPassword', this)"
          >👁️</span>
        </div>
        <span class="error-text hidden text-red-500 text-sm" id="signup-password-error"></span>
      </div>

      <!-- <div>
        <label class="block text-sm mb-1">Years of Experience</label>
        <input id="experience" placeholder="1" class="experience w-full border border-gray-300 rounded-lg px-3 py-2" />
        <span class="error-text hidden text-red-500 text-sm" id="signup-experience-error"></span>
      </div> -->

      <div>
        <label class="block text-sm mb-1">Farm Location</label>
        <input id="farmLocation" class="farmLocation w-full border border-gray-300 rounded-lg px-3 py-2"  placeholder="Benin-city, Lagoss, etc"/>
        <span class="error-text hidden text-red-500 text-sm" id="signup-farmLocation-error"></span>
      </div>

      <div>
        <label class="block text-sm mb-1">Farm Type</label>
        <input id="farmType" placeholder="Farm Type" class="farmType w-full border border-gray-300 rounded-lg px-3 py-2"  placeholder="Poultry, fishery maize farm"/>
        <span class="error-text hidden text-red-500 text-sm" id="signup-farmType-error"></span>
      </div>
      <span class="error-text hidden text-red-500 text-sm" id="signup-general-error"></span>
      <button class="mt-4 bg-green-700 hover:bg-green-800 text-white py-3 rounded-lg">
        Create Account
      </button>

      <p class="text-center text-sm mt-4">
        Already have an account?
        <span class="text-[#EAB76A] cursor-pointer" onclick="showForm('login')">
          Login
        </span>
      </p>
    </form>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="hidden flex flex-col gap-4">
      <h2 class="font-bold text-2xl text-center text-[#EAB76A] mb-4">
        Sign In
      </h2>

      <input id="loginName" class="loginName w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="Full Name" />
      <span class="error-text hidden text-red-500 text-sm" id="login-name-error"></span>
      <input id="loginPhone" class="loginPhone w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="Phone Number" />
      <span class="error-text hidden text-red-500 text-sm" id="login-phone-error"></span>
      <input id="loginEmail" class="loginEmail w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="Email" />
      <span class="error-text hidden text-red-500 text-sm" id="login-email-error"></span>

      <div class="flex items-center border border-gray-300 rounded-lg px-3">
        <input id="loginPassword" placeholder="Password" type="password" class="w-full py-2 outline-none" />
        <span
          class="text-blue-500 text-sm cursor-pointer"
          onclick="togglePassword('loginPassword', this)"
        >👁️</span>
      </div>
      <span class="error-text hidden text-red-500 text-sm" id="login-password-error"></span>
      
      <button class="bg-green-700 hover:bg-green-800 text-white py-3 rounded-lg">
        Login
      </button>
      <span class="error-text hidden text-red-500 text-sm" id="login-general-error"></span>
      <div class="flex justify-between text-sm">
        <span class="text-blue-500 cursor-pointer" onclick="showForm('forgot')">
          Forgot Password?
        </span>
      </div>
    </form>

    <!-- FORGOT PASSWORD -->
  <form id="forgotForm" class="hidden flex flex-col gap-4">
  <h2 class="font-bold text-xl text-center text-[#EAB76A] mb-4">
    Reset Password
  </h2>

  <!-- EMAIL -->
  <input 
    id="forgotEmail"
    class="w-full border border-gray-300 rounded-lg px-3 py-2"
    placeholder="Email"
    type="email"
  />
  <span class="error-text hidden text-red-500 text-sm" id="forgot-name-error"></span>


  <!-- RESET CODE (HIDDEN INITIALLY) -->
  <div class="code-field hidden">
    <input 
      id="forgotCode"
      class="w-full border border-gray-300 rounded-lg px-3 py-2"
      placeholder="Enter 4-digit code"
      maxlength="4"
    />
  </div>


  <!-- NEW PASSWORD (HIDDEN INITIALLY) -->
  <div class="new-password-field hidden">
    <div class="flex items-center border border-gray-300 rounded-lg px-3">
      <input 
        id="forgotNewPassword"
        placeholder="New password"
        type="password"
        class="w-full py-2 outline-none"
      />

      <span
        class="text-blue-500 text-sm cursor-pointer"
        onclick="togglePassword('forgotNewPassword', this)"
      >👁️</span>
    </div>
  </div>

  <span class="error-text hidden text-red-500 text-sm" id="forgot-password-error"></span>
  <span class="error-text hidden text-red-500 text-sm" id="forgot-general-error"></span>

  <button class="bg-green-700 hover:bg-green-800 text-white py-3 rounded-lg">
    Continue
  </button>
</form>

  </div>

  <script src="notifications.js"></script>
  <script src="signup.js"></script>
</body>
</html>
