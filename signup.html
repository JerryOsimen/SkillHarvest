<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillHarvest</title>

  <link rel="stylesheet" href="notifications.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    html, body {
      height: 100%;
      overflow-x: hidden;
    }

    label {
      color: #000;
      font-weight: 500;
    }
  </style>
</head>

<body class="w-full min-h-screen bg-white md:bg-[#1b5e20]">

<main class="w-full min-h-screen">

  <!-- ================= WELCOME ================= -->
  <section id="welcome" class="w-full h-screen flex items-center justify-center">
    <div class="w-full h-full flex flex-col items-center justify-center px-6
                md:h-auto md:max-w-2xl md:bg-white md:rounded-2xl md:shadow-2xl md:p-12">

      <h1 class="text-3xl md:text-4xl font-bold text-[#1b5e20] text-center">
        Welcome to SkillHarvest
      </h1>

      <div class="flex w-full gap-4 mt-8">
        <button id="welcomeSignup" class="w-1/2 py-3 rounded-lg bg-[#2e7d32] text-white">
          Sign Up
        </button>

        <button id="welcomeLogin" class="w-1/2 py-3 rounded-lg bg-[#2e7d32] text-white">
          Sign In
        </button>
      </div>
    </div>
  </section>

  <!-- ================= FORMS ================= -->
  <section id="holder" class="hidden w-full min-h-screen flex justify-center">

    <div class="w-full min-h-screen px-6 py-8
                md:min-h-0 md:max-w-lg md:bg-white md:rounded-2xl md:shadow-xl md:p-10">

      <!-- ================= SIGN UP ================= -->
      <form id="signupForm" class="hidden flex flex-col gap-4">
        <h2 class="text-2xl font-bold text-center text-[#2e7d32]">Create Account</h2>

        <div><label>Full Name</label><input class="signupName border p-3 rounded-lg w-full" /></div>
        <div><label>Email</label><input class="signupEmail border p-3 rounded-lg w-full" /></div>
        <div><label>Date of Birth</label><input type="date" class="dob border p-3 rounded-lg w-full" /></div>
        <div><label>Gender</label><input class="gender border p-3 rounded-lg w-full" /></div>
        <div><label>Phone Number</label><input class="phone border p-3 rounded-lg w-full" /></div>
        <div><label>Password</label><input type="password" class="password border p-3 rounded-lg w-full" /></div>
        <div><label>Years of Experience</label><input class="experience border p-3 rounded-lg w-full" /></div>
        <div><label>Farm Location</label><input class="farmLocation border p-3 rounded-lg w-full" /></div>
        <div><label>Farm Type</label><input class="farmType border p-3 rounded-lg w-full" /></div>

        <button type="submit" class="bg-[#2e7d32] text-white py-3 rounded-lg mt-2">
          Create Account
        </button>

        <p class="text-center text-sm">
          Already have an account?
          <span class="text-[#2e7d32] cursor-pointer" id="signupToLogin">Login</span>
        </p>
      </form>

      <!-- ================= LOGIN ================= -->
      <form id="loginForm" class="hidden flex flex-col gap-4">
        <h2 class="text-2xl font-bold text-center text-[#2e7d32]">Sign In</h2>

        <div><label>Email</label><input class="loginEmail border p-3 rounded-lg w-full" /></div>
        <div><label>Password</label><input type="password" class="loginPassword border p-3 rounded-lg w-full" /></div>

        <p class="text-sm text-right text-[#2e7d32] cursor-pointer" id="forgotPasswordBtn">
          Forgot password?
        </p>

        <button type="submit" class="bg-[#2e7d32] text-white py-3 rounded-lg">
          Login
        </button>

        <p class="text-center text-sm">
          Don’t have an account?
          <span class="text-[#2e7d32] cursor-pointer" id="loginToSignup">Sign Up</span>
        </p>
      </form>

      <!-- ================= FORGOT PASSWORD ================= -->
      <form id="forgotForm" class="hidden flex flex-col gap-4">
        <h2 class="text-2xl font-bold text-center text-[#2e7d32]">Reset Password</h2>

        <div>
          <label>Email</label>
          <input class="forgotName border p-3 rounded-lg w-full" />
        </div>

        <div>
          <label>New Password</label>
          <input type="password" id="resetPassword" class="border p-3 rounded-lg w-full" />
        </div>

        <button type="submit" class="bg-[#2e7d32] text-white py-3 rounded-lg">
          Reset Password
        </button>

        <p class="text-center text-sm">
          Remembered your password?
          <span class="text-[#2e7d32] cursor-pointer" id="forgotToLogin">
            Back to Login
          </span>
        </p>
      </form>

    </div>
  </section>
</main>

<script src="notifications.js"></script>
<script src="auth.js"></script>

</body>
</html>
