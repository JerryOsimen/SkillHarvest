<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>skilharvest</title>
  <link rel="stylesheet" href="signup.css" />
</head>
<body>
  <div class="container">
    <h1>Welcome</h1>
    <button onclick="showForm('signup')">Sign Up</button>
    <button onclick="showForm('login')">Login</button>

    <form id="signupForm" class="form hidden">
      <h2>Sign Up</h2>
      <input type="text" placeholder="full name" required /><br />
      <input type="email" placeholder="Email" required /><br />
      <input type="number/text" placeholder="Date of birth" required /><br />
      <input type="text" placeholder="Gender" required /><br />
      <input type="number" placeholder="phone no." required /><br />
      <input type="password" placeholder="Password" required /><br />
      <input type="text" placeholder="years of experince" required /><br />
      <input type=text" placeholder="Farm location" required /><br />
      <input type="text" placeholder="farm type" required /><br />
      <input type="number" placeholder="CAC No" required /><br />
      <button type="submit">Submit</button>
    </form>

    <form id="loginForm" class="form hidden">
      <h2>Login</h2>
      <input type="email" placeholder="Email" required /><br />
      <input type="password" placeholder="Password" required /><br />
      <button type="submit">Login</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
