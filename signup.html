<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SkillHarvest</title>
  <link rel="stylesheet" href="signup.css" />
</head>
<body>

  <div class="container">
    <h1>Welcome to SkillHarvest</h1>

    <div class="btn-group">
      <button onclick="showForm('signup')">Sign Up</button>
      <button onclick="showForm('login')">Sign In</button>
    </div>

    <!-- SIGN UP FORM -->
    <form id="signupForm" class="form hidden">
      <h2>Sign Up</h2>

      <input type="text" placeholder="Full Name" required />
      <input type="email" placeholder="Email" required />
      <input type="date" placeholder="Date of Birth" required />
      <input type="text" placeholder="Gender" required />
      <input type="tel" placeholder="Phone Number" required />
      <input type="password" placeholder="Password" required />
      <input type="number" placeholder="Years of Experience" required />
      <input type="text" placeholder="Farm Location" required />
      <input type="text" placeholder="Farm Type (Poultry, Rice, Pig etc)" required />
      <input type="number" placeholder="CAC Number" required />

      <button type="submit">Create Account</button>
    </form>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="form hidden">
      <h2>Sign In</h2>

      <input type="text" placeholder="Full Name" required />
      <input type="tel" placeholder="Phone Number" required />
      <input type="password" placeholder="Password" required />

      <button type="submit">Login</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
