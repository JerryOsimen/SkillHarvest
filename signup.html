<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillHarvest</title>

  <!-- Notification styles -->
  <link rel="stylesheet" href="notifications.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen w-full bg-white md:bg-[#1b5e20] flex items-center justify-center">

  <!-- WRAPPER -->
  <main class="w-full min-h-screen md:min-h-0 px-4 md:px-10 py-10 md:py-12 flex flex-col items-center">

    <!-- WELCOME PAGE -->
    <section id="welcome" class="flex flex-col items-center justify-center gap-12 w-full min-h-screen">

      <!-- Container only on md+ screens -->
      <div class="w-full flex flex-col items-center md:max-w-2xl md:bg-white md:rounded-2xl md:shadow-2xl md:p-10">

        <h1 class="font-bold text-3xl md:text-4xl text-center md:text-[#1b5e20]">
          Welcome to SkillHarvest
        </h1>

        <div class="flex w-full gap-4 mt-6">
          <button type="button" class="w-1/2 py-3 rounded-lg bg-[#2e7d32] text-white font-medium" onclick="showForm('signup')">
            Sign Up
          </button>
          <button type="button" class="w-1/2 py-3 rounded-lg bg-[#2e7d32] text-white font-medium" onclick="showForm('login')">
            Sign In
          </button>
        </div>

      </div>
    </section>

    <!-- FORM HOLDER -->
    <section id="holder" class="hidden w-full flex justify-center mt-6">

      <!-- Container only on md+ screens -->
      <div class="w-full flex flex-col md:max-w-lg md:bg-white md:shadow-lg md:rounded-2xl md:p-10 gap-4">

        <!-- SIGN UP FORM -->
        <form id="signupForm" class="hidden flex flex-col gap-4">

          <h2 class="text-2xl font-bold text-center text-[#2e7d32]">Create Account</h2>

          <div class="flex flex-col gap-1">
            <label>Full Name</label>
            <input id="fullName" class="border rounded-lg p-3 signupName" />
            <span class="error-text" id="signup-name-error"></span>
          </div>

          <div class="flex flex-col gap-1">
            <label>Email</label>
            <input id="email" class="border rounded-lg p-3 signupEmail" />
            <span class="error-text" id="signup-email-error"></span>
          </div>

          <div class="flex flex-col gap-1">
            <label>Date of Birth</label>
            <input type="date" class="border rounded-lg p-3 dob" />
          </div>

          <div class="flex flex-col gap-1">
            <label>Gender</label>
            <input class="border rounded-lg p-3 gender" />
          </div>

          <div class="flex flex-col gap-1">
            <label>Phone Number</label>
            <input class="border rounded-lg p-3 phone" />
          </div>

          <div class="flex flex-col gap-1">
            <label>Password</label>
            <div class="flex items-center border rounded-lg px-3">
              <input type="password" id="signupPassword" class="w-full py-3 outline-none password" />
              <span class="text-sm cursor-pointer text-blue-600" onclick="togglePassword('signupPassword', this)">👁️ Show</span>
            </div>
            <span class="error-text" id="signup-password-error"></span>
          </div>

          <div class="flex flex-col gap-1">
            <label>Years of Experience</label>
            <input class="border rounded-lg p-3 experience" />
          </div>

          <div class="flex flex-col gap-1">
            <label>Farm Location</label>
            <input class="border rounded-lg p-3 farmLocation" />
          </div>

          <div class="flex flex-col gap-1">
            <label>Farm Type</label>
            <input class="border rounded-lg p-3 farmType" />
          </div>

          <span class="error-text" id="signup-general-error"></span>

          <button type="submit" class="mt-4 bg-[#2e7d32] text-white py-3 rounded-lg">Create Account</button>

          <p class="text-center text-sm">
            Already have an account?
            <span class="text-[#2e7d32] cursor-pointer" onclick="showForm('login')">Login</span>
          </p>
        </form>

        <!-- LOGIN FORM -->
        <form id="loginForm" class="hidden flex flex-col gap-4">

          <h2 class="text-2xl font-bold text-center text-[#2e7d32]">Sign In</h2>

          <div class="flex flex-col gap-1">
            <label>Full Name</label>
            <input class="border rounded-lg p-3 loginName" />
            <span class="error-text" id="login-name-error"></span>
          </div>

          <div class="flex flex-col gap-1">
            <label>Email</label>
            <input class="border rounded-lg p-3 loginEmail" />
            <span class="error-text" id="login-email-error"></span>
          </div>

          <div class="flex flex-col gap-1">
            <label>Password</label>
            <div class="flex items-center border rounded-lg px-3">
              <input type="password" id="loginPassword" class="w-full py-3 outline-none loginPassword" />
              <span class="text-sm cursor-pointer text-blue-600" onclick="togglePassword('loginPassword', this)">👁️ Show</span>
            </div>
            <span class="error-text" id="login-password-error"></span>
          </div>

          <span class="error-text" id="login-general-error"></span>

          <button type="submit" class="bg-[#2e7d32] text-white py-3 rounded-lg">Login</button>

          <p class="text-center text-sm">
            Don’t have an account?
            <span class="text-[#2e7d32] cursor-pointer" onclick="showForm('signup')">Sign Up</span>
          </p>
        </form>

      </div>
    </section>

  </main>

  <script src="notifications.js"></script>
  <script src="signup.js"></script>
</body>
</html>
