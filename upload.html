<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Screen</title>
    <link rel="stylesheet" href="upload.css" />
  </head>

  <body>
    <div class="upload-screen">
      <!-- Header -->
      <div class="header">
        <h3>Add Video Details</h3>
        <p>
          Help farmers find your knowledge by adding detailed tags and
          descriptions.
        </p>
      </div>

      <!-- Video Upload -->
      <div class="upload-video">
        <label class="upload-box">
          <input type="file" accept="video/*" hidden />
          <div class="upload-content">
            <p>Click to upload video</p>
            <small>MP4, MOV, AVI</small>
          </div>
        </label>

        <button class="upload-btn">Upload</button>
      </div>

      <!-- Title -->
      <div class="card">
        <label class="label">
          <span class="required">Title*</span>
          <span class="hint">Clear and descriptive</span>
        </label>

        <input
          type="text"
          id="titleInput"
          maxlength="100"
          placeholder="Enter video title"
        />
        <div class="counter">0/100</div>
      </div>

      <!-- Description -->
      <div class="card">
        <label class="label">
          <span class="required">Description*</span>
          <span class="hint">What will farmers learn?</span>
        </label>

        <textarea rows="6" placeholder="Enter description"></textarea>
      </div>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav">
        <div class="nav-item">
          <img
            src="https://res.cloudinary.com/dpjfggsoh/image/upload/v1768129072/Vector_wnqxiv.png"
            alt=""
          />
          <p>Home</p>
        </div>
        <div class="nav-item">
          <img
            src="https://res.cloudinary.com/dpjfggsoh/image/upload/v1768129484/Vector_i442ed.png"
            alt=""
          />
          <p>Search</p>
        </div>
        <div class="nav-item1">
          <img
            src="https://res.cloudinary.com/dpjfggsoh/image/upload/v1768130535/Vector_hmfo64.png"
            alt=""
          />
          <p>Saved</p>
        </div>
        <div class="nav-item">
          <img
            src="https://res.cloudinary.com/dpjfggsoh/image/upload/v1768130314/Vector_gsuw4a.png"
            alt=""
          />
          <p>Profile</p>
        </div>
      </nav>
    </div>

    <script src="upload.js"></script>
  </body>
</html>
