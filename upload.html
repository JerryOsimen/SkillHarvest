<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Video</title>
  <link rel="stylesheet" href="upload.css">
</head>
<body>

  <div class="upload-screen">

    <h3>Add Video Details</h3>
    <p>Help farmers find your knowledge.</p>

    <label class="upload-box">
      <input type="file" id="videoInput" accept="video/*" hidden />
      <div class="upload-content">
        <p>Click to upload video</p>
        <small>MP4, MOV, AVI</small>
      </div>
    </label>

    <video id="previewVideo" class="hidden w-full mt-4 rounded-lg" controls></video>

    <div>
      <label>Title*</label>
      <input type="text" id="videoTitle" />
    </div>

    <div>
      <label>Description*</label>
      <textarea id="videoDescription" rows="4"></textarea>
    </div>

    <button id="uploadBtn">Upload Video</button>

  </div>

  <script src="upload.js"></script>
</body>
</html>
