<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://kit.fontawesome.com/79e3c5887d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="video.css">
    <title>Video Player</title>
</head>

<body class="min-w-full bg-gray-100 max-md:text-[10px] font-[poppins]">

    <!-- NAV BAR -->
    <nav class="navbar w-full sticky top-0 flex justify-between items-center px-10 py-2 bg-[#2e7d32] text-white z-50">

        <div class="nav-left flex items-center gap-2">
            <button id="menuBtn" class="video-card menu-btn size-8 bg-[#1b5e20] hover:bg-[#1b5e20] flex justify-center items-center">
                <i class="fa-solid fa-bars text-[18px]"></i>
            </button>

            <a href="../index.html" class="logo flex items-center">
                <img class="size-10" src="./Videocard/assets/logo.png" alt="logo">
                Skillharvest
            </a>
        </div>
        <div class="flex items-center h-8 bg-black text-sm rounded-2xl pl-3 w-full max-w-xs max-sm:hidden max-md:w-32 md:max-w-sm lg:max-w-md xl:max-w-2xl">
            <form action="" method="post" id="searchForm" class="w-full flex">
            <input 
                id="search-bar"
                type="text"
                class="search-bar text-white outline-none w-full mr-auto bg-transparent"
                placeholder="Search"
                name="search-bar">
            <button
                class="search-button video-card bg-[#1b5e20] rounded-r-2xl hover:bg-[#1b5e20] w-12 h-8 flex items-center justify-center" id="searchBut">
                <img class="size-5 filter invert brightness-0" src="./Videocard/assets/mingcute_search-line.png" alt="">
            </button>
            </form>
        </div>
        <div class="nav-right flex items-center gap-4">
            <a href="../login.html"
                class="video-card nav-link text-[12px] max-md:text-[10px] 
                rounded-3xl hover:bg-[#1b5e20]
                 bg-[#1b5e20] px-4 py-2
                 ">
                <i class="fa-solid fa-plus pr-2"></i>Create
            </a>

            <a href="../signup.html"
                class="nav-link size-9 flex justify-center items-center hover:bg-[#1b5e20] bg-[#1b5e20] rounded-full">
                <img class="size-6"
                    src="https://res.cloudinary.com/dbgowpxtw/image/upload/v1767883781/SkillHarvest/noto-v1_man-office-worker_wbwj0f.png"
                    alt="">
            </a>
        </div>
    </nav>

    <!-- SIDEBAR -->
    <aside id="sidebar"
        class="w-64 h-full bg-[#2e7d32] text-white hidden fixed top-0 left-0 z-40 transition-transform duration-300 ease-in-out max-md:w-full max-md:h-auto">

        <div class="flex justify-between items-center pt-4 px-4 mt-10">
            <h2 class="font-bold text-white pl-4">Menu</h2>
            <button id="closeBtn" class="w-8 h-8 hover:bg-[#1b5e20]">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <ul class="flex flex-col gap-4 px-5 py-4" id="menuItems">
            <li><a href="../Homepage.html" class="hover:bg-[#1b5e20] rounded-xl px-3 py-2 flex items-center gap-3"><i
                        class="fa-solid fa-house"></i> Home</a></li>
            <li><a href="../uploadVideo.html" class="hover:bg-[#1b5e20] rounded-xl px-3 py-2 flex items-center gap-3"><i
                        class="fa-solid fa-compass"></i>Upload videos</a></li>
            <li><a href="../video.html"
                    class="hover:bg-[#1b5e20] rounded-xl px-3 py-2 flex items-center gap-3"><i
                        class="fa-solid fa-video"></i> Videos</a></li>
            <li><a href="../profile.html" class="hover:bg-[#1b5e20] rounded-xl px-3 py-2 flex items-center gap-3"><i
                        class="fa-solid fa-user"></i> Profile</a></li>
            <li><a href="../landingpage.html" class="hover:bg-[#1b5e20] rounded-xl px-3 py-2 flex items-center gap-3"><i
                        class="fa-solid fa-cog"></i> Landing page </a>
                </li>
        </ul>
    </aside>

    <!-- MAIN LAYOUT -->
    <div class="grid  grid-cols-[1fr_500px] max-lg:grid-cols-1 gap-2 px-10 py-5 ">

        <!-- MAIN VIDEO PANEL -->
        <div class="rounded-3xl bg-white w-full max-w-full h-fit mt-5 overflow-hidden">

            <!-- Video Screen -->
            <div class="flex justify-center  items-center relative" id="Video-screen">

                <video autoplay muted controls
                    class="w-full h-[450px] max-sm:h-[300px] object-cover rounded-3xl"
                    id="play-screen">
                    <source id="main-screen-src" src="" type="video/mp4">
                </video>

                <!-- Video Overlay Button -->
                <div id="playOverlay" class="absolute inset-0 flex justify-center items-center pointer-events-none">
                    <button id="playBtn" class="bg-white rounded-full size-12 pointer-events-auto z-10">
                        <i class="fa-solid fa-pause"></i>
                    </button>
                </div>
            </div>

            <!-- VIDEO INFORMATION -->
            <div class="video-info w-full rounded-b-2xl bg-white flex flex-col px-6 py-5">

                <h2 id="video-title" class="text-gray-900 font-bold py-5 tracking-wider">
                </h2>

                <!-- Buttons Row -->
                <div class="flex justify-between items-center max-md:text-[10px] pb-3">
                    <button id="likes" class="tags flex px-3 py-2 font-bold border-2 border-gray-500 items-center rounded-2xl"><i
                            class="fa-regular fa-thumbs-up px-2"></i></button>

                    <label for="comment-input"
                        class="flex tags px-3 py-2 font-bold border-2 border-gray-500 items-center rounded-2xl comments"><i
                            class="fa-regular fa-comment px-2"></i>45</label>

                    <button class="tags flex justify-center px-3 py-3 font-bold border-2 border-gray-500 items-center rounded-2xl"
                    id="bookmarkBtn"><i
                            class=" fa-regular fa-bookmark"></i></button>

                    <button class="tags flex px-3 py-2 font-bold border-2 border-gray-500 items-center rounded-2xl" id="shareBtn"><i
                            class="fa-solid fa-share-nodes px-2"></i>...</button>
                </div>

                <!-- Author Section -->
                <div class="flex items-center bg-[#eab76a2f] p-3 rounded-2xl">

                    <a href="../profile"
                        class="size-10 flex justify-center items-center bg-[#2e7d32] rounded-full px-2 mr-4">
                        <img class="size-6"
                            src="https://res.cloudinary.com/dbgowpxtw/image/upload/v1767883781/SkillHarvest/noto-v1_man-office-worker_wbwj0f.png"
                            alt="">
                    </a>

                    <div class="flex flex-col w-full">
                        <h2 id="authorsName" class="authorsName font-semibold">John Adeola</h2>

                        <div class="flex justify-between text-gray-800 px-2">
                            <span id="location" class=""><i class="fa-regular fa-comment px-2"></i>Ogun</span>
                            <span id="views" class="mr-10"><i class="fa-regular fa-eye px-2"></i>views</span>
                        </div>
                    </div>

                    <button class="px-3 bg-[#2e7d32] video-card py-2 rounded-2xl text-white">Follow</button>
                </div>

                <!-- ABOUT VIDEO -->
                <div class="flex flex-col py-2 px-4 my-4 rounded-xl bg-[#eab76a2f]">

                    <div id="authorsDetails" class="cursor-pointer">
                        <h2 class="font-bold py-3">About this video</h2>
                        <h3 id="uploadDate" class="pb-3">Updated <span class="uploadDate">5 days ago</span></h3>
                        <button class="text-[10px]">More from <span class="authorsName">Musa Ibrahim...</span></button>
                    </div>

                    <div id="moreDescription" class="hidden">
                        <p id="video-description" class="text-gray-800 text-xs py-2 pb-5">
                            Learn effective maize spacing techniques to maximize your crop yield...
                        </p>

                        <div class="download-btn bg-white font-bold w-full flex justify-center px-3 py-3 rounded-xl">
                            <button id="downloadVideo" type="button">Download for Offline Viewing</button>
                        </div>
                    </div>
                    <button class="items-flex-start py-2 hidden text-[10px]" id="showless">showless</button>

                </div>

                <!-- COMMENTS -->
                <div id="comment" class="w-full bg-[#2e7d32] rounded-xl py-4 px-4">

                    <ul id="commentBox" class="w-full max-w-full"></ul>

                    <div class="w-full bg-white rounded-xl py-2 px-2 flex">
                        <input type="text" id="comment-input" class="w-full outline-none" placeholder="comment">
                        <button id="submit-comment" class="text-green-700"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>

            </div>
        </div>

        <!-- SIDE VIDEO LIST -->
        <div class="grid grid-rows-[50px_auto] max-md:text-[12px] gap-2 rounded-2xl p-2">

            <!-- Filter Buttons -->
            <div class="grid grid-cols-[120px_1fr_100px] max-md:grid-cols-[1fr_2fr_1fr]  h-12 rounded-3xl p-2 gap-2 text-white">
                <div class="flex rounded-xl justify-center bg-[#2e7d32] hover:bg-[#1b5e20]" id="totalVideos"><button>All</button></div>
                <div class="flex rounded-xl justify-center bg-[#2e7d32] hover:bg-[#1b5e20]" id="similarVideos"><button>Similar videos</button></div>
                <div class="flex rounded-xl justify-center bg-[#2e7d32] hover:bg-[#1b5e20]" id="trendingVideos"><button>Trending</button></div>
            </div>

            <!-- Grid of Video Cards -->
            <div id="videoList"
                class="grid gap-3 px-2 max-lg:grid-cols-3 
                h-fit
                max-md:grid-cols-2">
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="video.js"></script>
</body>

</html>
